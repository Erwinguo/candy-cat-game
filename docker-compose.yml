services:
  db:
    image: postgres:16-alpine
    container_name: tangdou-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tangdou
      POSTGRES_USER: tangdou
      POSTGRES_PASSWORD: tangdou_dev_password
    ports:
      - "5432:5432"
    volumes:
      - tangdou-db-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tangdou -d tangdou"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    container_name: tangdou-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://tangdou:tangdou_dev_password@db:5432/tangdou
      DATABASE_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:18080,http://127.0.0.1:18080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:18080}
      JWT_SECRET: tangdou-local-dev-secret-change-before-public-deploy
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8787/api/auth/google/callback}
    ports:
      - "8787:8787"

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: tangdou-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TANGDOU_API_BASE: ${TANGDOU_API_BASE:-http://localhost:8787}
    ports:
      - "18080:80"

volumes:
  tangdou-db-data:
